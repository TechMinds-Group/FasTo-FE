<div class="sg-acesso-page">
  <div class="container mt-5 mb-5">
    <div class="d-flex align-items-center gap-3 mb-4">
      <button (click)="voltar()" class="btn btn-outline-secondary rounded-circle p-2 shadow-sm btn-voltar" title="Cancelar cadastro">
        <i class="fas fa-arrow-left custom-dark-text"></i>
      </button>
      <div>
        <h1 class="h2 fw-bold mb-1 custom-dark-text">Novo Estabelecimento</h1>
        <p class="text-muted small mb-0 custom-dark-text">Preencha os dados do novo estabelecimento. Um administrador será criado automaticamente.</p>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-12">
        <div class="card border-0 shadow-sm p-4 custom-dark-card rounded-4">
          <form [formGroup]="form" (ngSubmit)="salvar()">
            <div class="row g-3">

              <div class="col-sm-6 col-12">
                <tm-text
                  formControlName="nome"
                  [label]="'Nome do Estabelecimento *'"
                  placeholder="Ex: MINHAEMPRESA"
                  class="custom-dark-text"
                ></tm-text>
                @if (form.get('nome')?.touched && form.get('nome')?.invalid) {
                  <div class="text-danger extra-small mt-1">Nome é obrigatório (será normalizado como slug).</div>
                }
              </div>

              <div class="col-sm-6 col-12">
                <tm-text
                  formControlName="nomeExibicao"
                  [label]="'Nome de Exibição'"
                  placeholder="Ex: Minha Empresa Ltda"
                  class="custom-dark-text"
                ></tm-text>
              </div>

              <div class="col-sm-6 col-12">
                <tm-text
                  formControlName="cnpj"
                  [label]="'CNPJ'"
                  placeholder="00.000.000/0000-00"
                  mask="cnpj"
                  class="custom-dark-text"
                ></tm-text>
              </div>

              <div class="col-sm-6 col-12">
                <tm-text
                  formControlName="telefone"
                  [label]="'Telefone / WhatsApp'"
                  placeholder="(11) 99999-9999"
                  mask="phone"
                  [maxlength]="20"
                  class="custom-dark-text"
                ></tm-text>
              </div>

            </div>

            <div class="d-flex gap-3 mt-4 justify-content-end flex-column flex-sm-row">
              <button type="button" class="btn btn-outline-secondary fw-semibold px-4 py-2 rounded-3" (click)="voltar()">
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary fw-bold px-4 py-2 rounded-3" [disabled]="salvando()">
                @if (salvando()) {
                  <span class="spinner-border spinner-border-sm me-2" role="status"></span>Salvando...
                } @else {
                  <i class="fas fa-plus-circle me-2"></i>Cadastrar
                }
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
